<!doctype html>
<!--
  Hero source for articles/final/a-crash-proof-team-of-coding-agents.md.
  Render: assets/hero-src/render.sh -> assets/medium-heroes/a-crash-proof-team-of-coding-agents.png
  From-scratch redesign (2026-09-02, replaces the orbit metaphor): the article's
  own signature scene drawn as a monitor trace. Indigo pulses cross the canvas,
  a red kill snaps the trace, two silent minutes flatline, and the SAME session
  resumes green to a merged ring; the purple session-ID chip bridges the gap,
  the one link, carried by the last heartbeat. Ledger ticks run along the base.
  Plain-text wordmarks; family palette; tag is only the parallel line.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --slate:#0f172a; --ink:#020617;
    --amber:#fbbf24; --amber2:#f59e0b;
    --indigo:#818cf8; --indigo2:#6366f1;
    --pulse:#34d399; --red:#f87171;
    --purple:#a78bfa; --purple2:#7c3aed;
    --t1:#f8fafc; --t2:#cbd5e1; --t3:#94a3b8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:640px}
  body{
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1100px 520px at 76% 62%, rgba(99,102,241,.20), transparent 60%),
      radial-gradient(760px 420px at 88% 40%, rgba(52,211,153,.10), transparent 65%),
      radial-gradient(900px 480px at 10% 30%, rgba(245,158,11,.12), transparent 62%),
      linear-gradient(135deg,#0b1120 0%, var(--slate) 46%, var(--ink) 100%);
    overflow:hidden;
  }
  .stage{position:relative;width:1600px;height:640px}
  .grid{position:absolute;inset:0;
    background-image:radial-gradient(rgba(148,163,184,.08) 1px, transparent 1.4px);
    background-size:26px 26px;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 100%);}
  svg{position:absolute;inset:0}
  .scrim{position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(2,6,23,.92) 0%, rgba(2,6,23,.74) 30%, rgba(2,6,23,0) 52%);}
  .text{position:absolute;left:84px;top:0;height:100%;width:740px;
    display:flex;flex-direction:column;justify-content:center;z-index:3}
  /* plain text wordmarks, deliberately no vendor logo lockup */
  .lockup{display:flex;align-items:baseline;gap:16px;margin-bottom:28px;
    font-family:"SF Mono",Menlo,monospace;letter-spacing:.06em}
  .lockup .bname{font-size:21px;font-weight:700;color:var(--t2)}
  .lockup .cross{font-size:18px;color:var(--t3)}
  h1{font-size:78px;line-height:1.02;font-weight:800;color:var(--t1);letter-spacing:-.02em}
  h1 .glow{background:linear-gradient(90deg,var(--amber),#fcd34d 40%,var(--indigo));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .rule{width:88px;height:4px;margin:32px 0 28px;border-radius:3px;
    background:linear-gradient(90deg,var(--amber2),var(--indigo2))}
  .tag{font-size:28px;line-height:1.42;color:var(--t1);font-weight:600;max-width:640px}
  .cap{position:absolute;z-index:3;font-family:"SF Mono",Menlo,monospace;
    font-size:16px;letter-spacing:.04em;font-weight:600}
  .cap.crash{left:952px;top:180px;color:var(--red)}
  .cap.silent{left:1046px;top:470px;color:var(--t3)}
  .cap.same{left:1250px;top:180px;color:var(--pulse)}
  .cap.ship{left:1494px;top:352px;color:var(--t1)}
  /* the session-ID chip: the durable record, the one link */
  .chip{position:absolute;left:1042px;top:236px;z-index:3;
    font-family:"SF Mono",Menlo,monospace;font-size:17px;font-weight:700;
    color:#ddd6fe;background:rgba(124,58,237,.18);
    border:1.5px solid var(--purple2);border-radius:10px;
    padding:9px 16px;letter-spacing:.05em;
    box-shadow:0 0 24px rgba(124,58,237,.35)}
  /* sits under the Same Session caption: clear sky, and the two lines read
     as one sentence; at the chip it collided with the dotted arc */
  .chipnote{position:absolute;left:1252px;top:208px;z-index:3;
    font-family:"SF Mono",Menlo,monospace;font-size:13px;color:var(--purple);
    letter-spacing:.04em}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <svg width="1600" height="640" viewBox="0 0 1600 640" fill="none">
    <defs>
      <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft" x="-40%" y="-120%" width="180%" height="340%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- faint event-history ledger ticks along the base -->
    <g opacity=".22">
      <path d="M120 572 h1360" stroke="#1e293b" stroke-width="2"/>
      <g stroke="#475569" stroke-width="2">
        <path d="M160 560 v24"/><path d="M240 560 v24"/><path d="M320 560 v24"/><path d="M400 560 v24"/>
        <path d="M480 560 v24"/><path d="M560 560 v24"/><path d="M640 560 v24"/><path d="M720 560 v24"/>
        <path d="M800 560 v24"/><path d="M880 560 v24"/><path d="M960 560 v24"/><path d="M1040 560 v24"/>
        <path d="M1120 560 v24"/><path d="M1200 560 v24"/><path d="M1280 560 v24"/><path d="M1360 560 v24"/><path d="M1440 560 v24"/>
      </g>
    </g>

    <!-- ALIVE: indigo trace with steady pulses, dimmed under the text scrim -->
    <g filter="url(#glow)" fill="none" stroke="#818cf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 400
               L 240 400 l 12 -22 l 12 22 L 380 400 l 12 -22 l 12 22
               L 540 400 l 12 -22 l 12 22 L 700 400 l 12 -22 l 12 22
               L 850 400 l 14 -30 l 14 30 L 936 400 l 16 -44 l 14 44 l 8 0"/>
    </g>

    <!-- THE KILL: the trace snaps; red jag falls dead -->
    <g filter="url(#soft)" fill="none" stroke="#f87171" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M974 400 l 10 -14 l 8 14 l 6 0"/>
    </g>
    <!-- kill bolt above the snap -->
    <g transform="translate(942,208)" filter="url(#soft)">
      <path d="M40 0 L20 46 h20 l-8 34 34-48 H44 z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
      <g stroke="#fca5a5" stroke-width="3" stroke-linecap="round">
        <path d="M8 30 l-18 -8"/><path d="M70 16 l18 -10"/><path d="M66 80 l16 10"/>
      </g>
    </g>

    <!-- TWO SILENT MINUTES: dashed flatline -->
    <path d="M1002 400 H 1238" stroke="#475569" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>

    <!-- THE ONE LINK: purple arc from the last live pulse, through the chip, to the revival -->
    <path d="M958 352 C 1000 256, 1220 256, 1258 352"
          stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round" fill="none" filter="url(#soft)"/>
    <path d="M1252 340 l6 12 l-13 3" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- RESUMED: the SAME session picks up green and finishes -->
    <g filter="url(#glow)" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1238 400 l 14 -44 l 14 44
               L 1330 400 l 12 -22 l 12 22 L 1420 400 l 12 -22 l 12 22 L 1512 400"/>
    </g>

    <!-- merged / shipped node -->
    <circle cx="1524" cy="400" r="12" fill="#e2e8f0" filter="url(#glow)"/>
    <circle cx="1524" cy="400" r="22" fill="none" stroke="#34d399" stroke-width="2.5" opacity=".8"/>
    <!-- origin node: the filed issue -->
    <circle cx="70" cy="400" r="7" fill="#94a3b8"/>
  </svg>

  <div class="scrim"></div>

  <div class="text">
    <div class="lockup">
      <span class="bname">Claude&nbsp;Code</span>
      <span class="cross">×</span>
      <span class="bname">Temporal</span>
    </div>
    <h1>A Crash-Proof Team<br><span class="glow">of Coding Agents</span></h1>
    <div class="rule"></div>
    <div class="tag">Claude Code remembers the conversation;<br>Temporal remembers the job.</div>
  </div>

  <div class="cap crash">Kill&nbsp;-9</div>
  <div class="cap silent">Two&nbsp;Silent&nbsp;Minutes</div>
  <div class="cap same">Same&nbsp;Session</div>
  <div class="cap ship">Merged</div>
  <div class="chip">session&nbsp;698c…</div>
  <div class="chipnote">carried&nbsp;by&nbsp;the&nbsp;last&nbsp;heartbeat</div>
</div>
</body>
</html>
